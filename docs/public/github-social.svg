<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Yamete — a macOS app that reacts when you smack your laptop">

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#33101a"/>
      <stop offset="0.5" stop-color="#1f0810"/>
      <stop offset="1"   stop-color="#120509"/>
    </linearGradient>

    <radialGradient id="logoGlow" cx="290" cy="320" r="290" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ff6b8a" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ff6b8a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rightAccent" x1="540" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#9d1a3d" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#ff6b8a" stop-opacity="0.04"/>
    </linearGradient>

    <radialGradient id="faceFill" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#ffd8e2"/>
      <stop offset="60%"  stop-color="#ff9bb3"/>
      <stop offset="100%" stop-color="#c4365a"/>
    </radialGradient>

    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff8aa6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8aa6" stop-opacity="0"/>
    </radialGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <g id="impactRays">
      <g stroke="#ff6b8a" stroke-linecap="round" stroke-width="6" opacity="0.55">
        <line x1="0" y1="-200" x2="0" y2="-160"/>
        <line x1="0" y1="200"  x2="0" y2="160"/>
        <line x1="-200" y1="0" x2="-160" y2="0"/>
        <line x1="200" y1="0"  x2="160" y2="0"/>
        <line x1="-141" y1="-141" x2="-113" y2="-113"/>
        <line x1="141"  y1="-141" x2="113"  y2="-113"/>
        <line x1="-141" y1="141"  x2="-113" y2="113"/>
        <line x1="141"  y1="141"  x2="113"  y2="113"/>
      </g>
      <g stroke="#ffb3c4" stroke-linecap="round" stroke-width="3" opacity="0.7">
        <line x1="-77" y1="-185" x2="-62" y2="-150"/>
        <line x1="77"  y1="-185" x2="62"  y2="-150"/>
        <line x1="-77" y1="185"  x2="-62" y2="150"/>
        <line x1="77"  y1="185"  x2="62"  y2="150"/>
        <line x1="-185" y1="-77" x2="-150" y2="-62"/>
        <line x1="185"  y1="-77" x2="150"  y2="-62"/>
        <line x1="-185" y1="77"  x2="-150" y2="62"/>
        <line x1="185"  y1="77"  x2="150"  y2="62"/>
      </g>
    </g>

    <style>
      .title {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        fill: #fff5f7;
      }
      .tagline {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
        fill: #ffc8d4;
        opacity: 0.92;
      }
      .meta {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 500;
        fill: #ff9bb3;
        opacity: 0.7;
      }
      .repoMeta {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 600;
        fill: #ffc8d4;
        opacity: 0.7;
        letter-spacing: 0.04em;
      }
      .divider {
        stroke: #ff6b8a;
        stroke-opacity: 0.35;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#rightAccent)"/>
  <ellipse cx="290" cy="320" rx="270" ry="270" fill="url(#logoGlow)"/>

  <g transform="translate(290, 320)" filter="url(#logoShadow)">
    <use href="#impactRays"/>
    <circle cx="0" cy="0" r="135" fill="url(#faceFill)" stroke="#fff5f7" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse cx="-52" cy="22" rx="27" ry="14" fill="url(#cheek)"/>
    <ellipse cx="52"  cy="22" rx="27" ry="14" fill="url(#cheek)"/>
    <g stroke="#3d0a1a" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M-60 -18 Q-42 -32 -24 -18"/>
      <path d="M24  -18 Q42  -32 60  -18"/>
    </g>
    <path d="M-64 8 Q-60 16 -56 8 Q-60 -2 -64 8 Z" fill="#9ed8ff" opacity="0.85"/>
    <ellipse cx="0" cy="50" rx="21" ry="27" fill="#3d0a1a"/>
    <ellipse cx="0" cy="58" rx="11" ry="13" fill="#7a1a30"/>
  </g>

  <line x1="580" y1="80" x2="580" y2="560" class="divider"/>

  <g transform="translate(620, 175)">
    <text class="repoMeta" x="0" y="0" font-size="22">STUDNICKY / YAMETE</text>
    <text class="title"    x="0" y="100" font-size="124">Yamete</text>
    <text class="tagline"  x="0" y="170" font-size="32">a macOS menu bar app</text>
    <text class="tagline"  x="0" y="212" font-size="32">that reacts when you smack it</text>

    <g transform="translate(0, 252)">
      <circle cx="14"  cy="14" r="14" fill="#ff6b8a"/>
      <circle cx="58"  cy="14" r="14" fill="#ffb3c4"/>
      <circle cx="102" cy="14" r="14" fill="#9ed8ff"/>
    </g>

    <text class="meta" x="0" y="332" font-size="22">accelerometer · microphone · AirPods IMU</text>
  </g>
</svg>
