<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Yamete v2.5.1">

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#33101a"/>
      <stop offset="0.5" stop-color="#1f0810"/>
      <stop offset="1"   stop-color="#120509"/>
    </linearGradient>

    <radialGradient id="logoGlow" cx="270" cy="315" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ff6b8a" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ff6b8a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rightAccent" x1="500" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#9d1a3d" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#ff6b8a" stop-opacity="0.04"/>
    </linearGradient>

    <radialGradient id="faceFill" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#ffd8e2"/>
      <stop offset="60%"  stop-color="#ff9bb3"/>
      <stop offset="100%" stop-color="#c4365a"/>
    </radialGradient>

    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff8aa6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8aa6" stop-opacity="0"/>
    </radialGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <g id="impactRays">
      <g stroke="#ff6b8a" stroke-linecap="round" stroke-width="6" opacity="0.55">
        <line x1="0" y1="-200" x2="0" y2="-160"/>
        <line x1="0" y1="200"  x2="0" y2="160"/>
        <line x1="-200" y1="0" x2="-160" y2="0"/>
        <line x1="200" y1="0"  x2="160" y2="0"/>
        <line x1="-141" y1="-141" x2="-113" y2="-113"/>
        <line x1="141"  y1="-141" x2="113"  y2="-113"/>
        <line x1="-141" y1="141"  x2="-113" y2="113"/>
        <line x1="141"  y1="141"  x2="113"  y2="113"/>
      </g>
      <g stroke="#ffb3c4" stroke-linecap="round" stroke-width="3" opacity="0.7">
        <line x1="-77" y1="-185" x2="-62" y2="-150"/>
        <line x1="77"  y1="-185" x2="62"  y2="-150"/>
        <line x1="-77" y1="185"  x2="-62" y2="150"/>
        <line x1="77"  y1="185"  x2="62"  y2="150"/>
        <line x1="-185" y1="-77" x2="-150" y2="-62"/>
        <line x1="185"  y1="-77" x2="150"  y2="-62"/>
        <line x1="-185" y1="77"  x2="-150" y2="62"/>
        <line x1="185"  y1="77"  x2="150"  y2="62"/>
      </g>
    </g>

    <style>
      .title {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        fill: #fff5f7;
      }
      .tagline {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
        fill: #ffc8d4;
        opacity: 0.92;
      }
      .meta {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 500;
        fill: #ff9bb3;
        opacity: 0.75;
      }
      .version {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 700;
        fill: #fff5f7;
      }
      .versionPill {
        fill: #ff6b8a;
        fill-opacity: 0.22;
        stroke: #ff6b8a;
        stroke-opacity: 0.6;
        stroke-width: 1.5;
      }
      .divider {
        stroke: #ff6b8a;
        stroke-opacity: 0.35;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#rightAccent)"/>
  <ellipse cx="270" cy="315" rx="260" ry="260" fill="url(#logoGlow)"/>

  <g transform="translate(270, 315)" filter="url(#logoShadow)">
    <use href="#impactRays"/>
    <circle cx="0" cy="0" r="130" fill="url(#faceFill)" stroke="#fff5f7" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse cx="-50" cy="22" rx="26" ry="14" fill="url(#cheek)"/>
    <ellipse cx="50"  cy="22" rx="26" ry="14" fill="url(#cheek)"/>
    <g stroke="#3d0a1a" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M-58 -18 Q-40 -32 -22 -18"/>
      <path d="M22  -18 Q40  -32 58  -18"/>
    </g>
    <path d="M-62 8 Q-58 16 -54 8 Q-58 -2 -62 8 Z" fill="#9ed8ff" opacity="0.85"/>
    <ellipse cx="0" cy="48" rx="20" ry="26" fill="#3d0a1a"/>
    <ellipse cx="0" cy="56" rx="10" ry="12" fill="#7a1a30"/>
  </g>

  <line x1="540" y1="80" x2="540" y2="550" class="divider"/>

  <g transform="translate(580, 170)">
    <text class="title" x="0" y="0" font-size="120">Yamete</text>
    <text class="tagline" x="0" y="64" font-size="30">a macOS menu bar app</text>
    <text class="tagline" x="0" y="104" font-size="30">that reacts when you smack it</text>

    <!-- Version pill -->
    <g transform="translate(0, 152)">
      <rect class="versionPill" x="0" y="0" width="190" height="54" rx="27" ry="27"/>
      <text class="version" x="95" y="36" font-size="26" text-anchor="middle">v2.5.1</text>
    </g>

    <text class="meta" x="0" y="248" font-size="22">accelerometer · microphone · AirPods IMU</text>
  </g>
</svg>
